[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-template-manager"
version = "0.1.0"
description = "Prompt template manager — versioned, validated prompt templates with variable rendering — by Viprasol Tech."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = [
  "prompt-engineering",
  "prompt-template",
  "llm",
  "prompt-management",
  "versioning",
  "python",
  "templates",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pydantic>=2.13.4", "typer>=0.26.7", "rich>=15.0.0"]

[project.optional-dependencies]
dev = ["ruff>=0.15.16", "mypy>=2.1.0", "pytest>=9.0.3", "pytest-cov>=7.1.0"]

[project.scripts]
prompt-template-manager = "prompt_template_manager.cli:app"

[project.urls]
Homepage = "https://viprasol.com"
Repository = "https://github.com/Viprasol-Tech/prompt-template-manager"
Issues = "https://github.com/Viprasol-Tech/prompt-template-manager/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_template_manager"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4"]
ignore = ["B008", "B027", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
